<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Personal Blog Platform</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="task-manager">

        <h1>Interactive Personal Blog Platform</h1>

        <!-- Input fields for creating a new post -->
        <section id="taskForm">

            <label for="taskName">Post Title:</label>
            <input type="text" id="taskName" placeholder="Enter post title">
            <label for="taskContent">Post Content:</label>
            <textarea id="taskContent" placeholder="Write your post here..."></textarea>

            <!-- Custom error messages -->
            <p id="titleError"></p>
            <p id="contentError"></p>

            <button id="submitButton">Submit Post</button>
        </section>

        <!-- Display area for all blog posts -->
        <section id="taskSection">
            <h2>Posts</h2>
            <ul id="taskList"></ul>
        </section>

        <!-- Display area for dynamically created posts -->
        <div id="taskDisplay"></div>

    </main>

</body>

</html>
