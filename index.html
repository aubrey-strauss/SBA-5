<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="task-manager">

        <h1>Task Manager</h1>

        <!--Input fields for creating a new task-->
        <section id="taskForm">

            <label for="taskName">Task Name:</label>
            <input
                type="text"
                id="taskName"
                placeholder="Enter task name"
            >

            <label for="taskCategory">Category:</label>
            <input
                type="text"
                id="taskCategory"
                placeholder="Enter category"
            >

            <label for="taskDeadline">Deadline:</label>
            <input
                type="date"
                id="taskDeadline"
            >

            <label for="taskStatus">Status:</label>
            <select id="taskStatus">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <button id="addTaskButton">Add Task</button>

        </section>


        <!--A dropdown or buttons to filter tasks by status or category.-->
        <section id="filters">

            <label for="filterStatus">Filter by status:</label>

            <select id="filterStatus">
                <option value="All">All</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>

                <!--Add an overdue option-->
                <option value="Overdue">Overdue</option>
            </select>

        </section>


        <!--Create an HTML structure (such as an unordered list or table) to display the task list.-->
        <section id="taskSection">
            <h2>Tasks</h2>
            <ul id="taskList"></ul>
        </section>


        <!--Allow users to update the status of tasks (e.g., “In Progress,” “Completed”) via a dropdown or button.-->
        <select class="updateStatus">
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>


        <!--A display area to show the list of tasks, including options to update task status.-->
        <div id="taskDisplay"></div>

    </main>

</body>

</html>
